name: iOS - candidato para TestFlight
on:
  push:
    branches: [codex/mobile-stores]
    paths:
      - 'ios/**'
      - 'scripts/configure-ios.mjs'
      - 'scripts/ios-signing.sh'
      - '.github/workflows/mobile-ios*.yml'
permissions:
  contents: read
jobs:
  candidate:
    uses: ./.github/workflows/mobile-ios.yml
    with:
      variant: signed
      version: '3.4.0'
      build_number: '1'
      upload_testflight: true
    secrets: inherit

